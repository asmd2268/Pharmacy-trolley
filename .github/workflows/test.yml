name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for syntax errors in JS files
        run: |
          for f in app.js architecture/*.js; do
            node --check "$f" && echo "OK: $f" || exit 1
          done
      - name: Check patch formatting
        run: git diff --check
